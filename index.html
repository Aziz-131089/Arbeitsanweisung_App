<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AA-FW-014 – Rohrdrehmaschine RDM-02</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #475569;
      --primary: #0f172a;
      --danger: #dc2626;
      --danger-bg: #fff1f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .app-badge {
      font-size: 14px;
      font-weight: bold;
      color: var(--muted);
    }
    details.kopfdaten {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 12px;
    }
    details.kopfdaten summary {
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      list-style: none;
    }
    .kopf-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .kopf-full { grid-column: 1 / -1; }
    .psa-box {
      background: var(--danger-bg);
      border: 2px solid var(--danger);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .psa-title {
      color: var(--danger);
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 8px;
    }
    .step-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .step-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .step-title {
      font-weight: bold;
      font-size: 17px;
    }
    .field { margin-bottom: 10px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: var(--muted);
      margin-bottom: 4px;
    }
    input[type="text"], textarea {
      width: 100%;
      font-size: 16px;
      padding: 10px 12px;
      border: 1px solid #94a3b8;
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-family: inherit;
    }
    textarea { min-height: 78px; resize: vertical; }
    .btn {
      min-height: 46px;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      border: 1px solid #64748b;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      margin-top: 6px;
      margin-right: 6px;
    }
    .btn-sm {
      min-height: 36px;
      padding: 6px 10px;
      font-size: 13px;
      margin-top: 0;
      margin-right: 0;
    }
    .btn.active {
      background: #1d4ed8;
      color: #fff;
      border-color: #1d4ed8;
    }
    .btn-dark {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .btn-red {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }
    .editor-box {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }
    .hint {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
    }
    .status-note {
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
    }
    canvas {
      width: 100%;
      max-width: 440px;
      aspect-ratio: 4 / 3;
      border: 1px solid #94a3b8;
      border-radius: 8px;
      background: #e2e8f0;
      display: block;
      margin-top: 10px;
      touch-action: none;
    }
    .footer-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      padding-bottom: 24px;
    }
    @media print {
      body { background: #fff; padding: 0; }
      .top-bar, .btn, .editor-box, .hint, .status-note, .footer-actions { display: none !important; }
      details.kopfdaten { border: 1px solid #94a3b8; }
      details.kopfdaten > :not(summary) { display: block; }
      .step-card, .psa-box { break-inside: avoid; box-shadow: none; }
      input[type="text"], textarea { border: none; padding: 2px 0; font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <div class="app-badge" id="kopfKurz">AA-FW-014 · RDM-02</div>
      <div>
        <button type="button" class="btn btn-sm" onclick="speichernLokal(true)">💾 Speichern</button>
        <button type="button" class="btn btn-sm" onclick="window.print()">🖨️ Drucken</button>
      </div>
    </div>

    <details class="kopfdaten" id="kopfDetails">
      <summary id="kopfSummary">Kopfdaten: AA-FW-014 · RDM-02 (zum Aufklappen tippen)</summary>
      <div class="kopf-grid">
        <div>
          <label for="docNr">Dokumenten-Nr.</label>
          <input id="docNr" type="text" value="AA-FW-014" oninput="aktualisiereKopfKurz(); speichernLokal();" />
        </div>
        <div>
          <label for="docRev">Revision</label>
          <input id="docRev" type="text" value="Rev. 01" oninput="speichernLokal();" />
        </div>
        <div class="kopf-full">
          <label for="docTitel">Arbeitsanweisung / Maschine</label>
          <input id="docTitel" type="text" value="Rüsten und Bedienen der Rohrdrehmaschine RDM-02" oninput="speichernLokal();" />
        </div>
      </div>
    </details>

    <div class="psa-box">
      <div class="psa-title">Sicherheit / PSA</div>
      <textarea id="psaFeld" oninput="speichernLokal()" placeholder="Schutzbrille, Sicherheitsschuhe, Gehörschutz, keine Handschuhe an rotierenden Teilen...">Schutzbrille tragen, enganliegende Kleidung, keine Handschuhe oder lose Teile an rotierenden Maschinenteilen.</textarea>
      <button type="button" class="btn btn-red" onclick="einsprechen('psaFeld')">🎙️ Einsprechen (optional)</button>
    </div>

    <div id="schritteListe"></div>

    <div class="footer-actions">
      <button type="button" class="btn btn-dark" onclick="schrittHinzufuegen('', '', true)">+ Arbeitsschritt hinzufügen</button>
      <button type="button" class="btn" onclick="entwurfZuruecksetzen()">Entwurf leeren</button>
    </div>
    <div class="status-note" id="speicherStatus"></div>
  </div>

  <script>
    const STORAGE_KEY = 'aa_fw_014_rdm02_stand_v1';
    let schrittZaehler = 0;
    const bildStatus = {};

    function aktualisiereKopfKurz() {
      const nr = document.getElementById('docNr').value.trim() || 'AA-FW-014';
      document.getElementById('kopfKurz').textContent = `${nr} · RDM-02`;
      document.getElementById('kopfSummary').textContent = `Kopfdaten: ${nr} · RDM-02 (zum Aufklappen tippen)`;
    }

    function schrittHinzufuegen(taetigkeit = '', werkzeuge = '', bildDataUrl = null, formen = [], speichern = true) {
      schrittZaehler += 1;
      const nr = schrittZaehler;
      const karte = document.createElement('div');
      karte.className = 'step-card';
      karte.dataset.stepId = nr;
      karte.innerHTML = `
        <div class="step-head">
          <div class="step-title">Arbeitsschritt <span class="step-num">${nr}</span></div>
          <button type="button" class="btn btn-sm" onclick="schrittLoeschen(${nr})">Löschen</button>
        </div>
        <div class="field">
          <label for="taetigkeit-${nr}">Tätigkeitsbeschreibung</label>
          <textarea id="taetigkeit-${nr}" oninput="speichernLokal()" placeholder="Tätigkeit eintippen...">${escapeHtml(taetigkeit)}</textarea>
        </div>
        <div class="field">
          <label for="werkzeuge-${nr}">Werkzeuge / Hilfsmittel</label>
          <input id="werkzeuge-${nr}" type="text" value="${escapeAttr(werkzeuge)}" oninput="speichernLokal()" placeholder="Werkzeuge / Hilfsmittel eintippen..." />
        </div>
        <div>
          <button type="button" class="btn" onclick="bildAuswaehlen(${nr})">📷 Bild laden</button>
          <button type="button" class="btn" onclick="editorUmschalten(${nr})">Bild bearbeiten</button>
          <input type="file" id="datei-${nr}" accept="image/*" style="display:none" onchange="bildLaden(event, ${nr})" />
        </div>
        <div id="editor-${nr}" class="editor-box">
          <div>
            <button type="button" id="btn-kreis-${nr}" class="btn active" onclick="werkzeugWaehlen(${nr}, 'kreis')">Roter Kreis</button>
            <button type="button" id="btn-pfeil-${nr}" class="btn" onclick="werkzeugWaehlen(${nr}, 'pfeil')">Roter Pfeil</button>
            <button type="button" class="btn btn-dark" onclick="rueckgaengig(${nr})">↩ Rückgängig</button>
          </div>
          <div class="hint">Kreis/Pfeil antippen zum Verschieben · Am blauen Punkt ziehen für Größe &amp; Richtung.</div>
          <canvas id="canvas-${nr}" width="440" height="330"></canvas>
        </div>
      `;
      document.getElementById('schritteListe').appendChild(karte);
      canvasInitialisieren(nr, bildDataUrl, formen);
      schrittNummernAktualisieren();
      if (speichern) speichernLokal();
    }

    function schrittLoeschen(nr) {
      const karten = document.querySelectorAll('#schritteListe .step-card');
      if (karten.length <= 1) {
        document.getElementById(`taetigkeit-${nr}`).value = '';
        document.getElementById(`werkzeuge-${nr}`).value = '';
        bildStatus[nr].bild = null;
        bildStatus[nr].bildDataUrl = null;
        bildStatus[nr].formen = [];
        bildStatus[nr].verlauf = [];
        bildStatus[nr].ausgewaehltIndex = -1;
        standSpeichern(nr);
        canvasNeuZeichnen(nr);
        speichernLokal();
        return;
      }
      const karte = document.querySelector(`#schritteListe .step-card[data-step-id="${nr}"]`);
      if (karte) karte.remove();
      delete bildStatus[nr];
      schrittNummernAktualisieren();
      speichernLokal();
    }

    function schrittNummernAktualisieren() {
      const karten = document.querySelectorAll('#schritteListe .step-card');
      karten.forEach((karte, idx) => {
        const span = karte.querySelector('.step-num');
        if (span) span.textContent = idx + 1;
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/"/g, '&quot;');
    }

    function objektKlonen(obj) {
      return JSON.parse(JSON.stringify(obj));
    }

    function standSpeichern(nr) {
      const st = bildStatus[nr];
      if (!st) return;
      st.verlauf.push(st.formen.map(objektKlonen));
    }

    function rueckgaengig(nr) {
      const st = bildStatus[nr];
      if (!st || st.verlauf.length <= 1) return;
      st.verlauf.pop();
      st.formen = st.verlauf[st.verlauf.length - 1].map(objektKlonen);
      st.ausgewaehltIndex = -1;
      canvasNeuZeichnen(nr);
      speichernLokal();
    }

    function griffPosition(form) {
      if (form.typ === 'kreis') {
        return { x: form.cx + form.r, y: form.cy };
      }
      return { x: form.x2, y: form.y2 };
    }

    function canvasInitialisieren(nr, bildDataUrl = null, formen = []) {
      const canvas = document.getElementById(`canvas-${nr}`);

      bildStatus[nr] = {
        bild: null,
        bildDataUrl: bildDataUrl,
        werkzeug: 'kreis',
        formen: Array.isArray(formen) ? formen.map(objektKlonen) : [],
        verlauf: [],
        ausgewaehltIndex: -1,
        aktion: null,
        letzterX: 0,
        letzterY: 0
      };
      standSpeichern(nr);

      if (bildDataUrl) {
        const img = new Image();
        img.onload = () => {
          if (!bildStatus[nr]) return;
          bildStatus[nr].bild = img;
          canvasNeuZeichnen(nr);
        };
        img.src = bildDataUrl;
      } else {
        canvasNeuZeichnen(nr);
      }

      const punktErmitteln = (e) => {
        const rect = canvas.getBoundingClientRect();
        const quelle = e.touches && e.touches.length
          ? e.touches[0]
          : (e.changedTouches && e.changedTouches.length ? e.changedTouches[0] : e);
        return {
          x: ((quelle.clientX - rect.left) * canvas.width) / rect.width,
          y: ((quelle.clientY - rect.top) * canvas.height) / rect.height
        };
      };

      const abstand = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

      const formTreffer = (form, px, py) => {
        if (form.typ === 'kreis') {
          return abstand(px, py, form.cx, form.cy) <= form.r + 14;
        }
        const dx = form.x2 - form.x1;
        const dy = form.y2 - form.y1;
        const lenSq = dx * dx + dy * dy || 1;
        const t = Math.max(0, Math.min(1, ((px - form.x1) * dx + (py - form.y1) * dy) / lenSq));
        const projX = form.x1 + t * dx;
        const projY = form.y1 + t * dy;
        return abstand(px, py, projX, projY) <= 16;
      };

      const startZeichnen = (e) => {
        e.preventDefault();
        const st = bildStatus[nr];
        const p = punktErmitteln(e);
        st.letzterX = p.x;
        st.letzterY = p.y;

        if (st.ausgewaehltIndex >= 0 && st.formen[st.ausgewaehltIndex]) {
          const gp = griffPosition(st.formen[st.ausgewaehltIndex]);
          if (abstand(p.x, p.y, gp.x, gp.y) <= 20) {
            st.aktion = 'groesse';
            canvasNeuZeichnen(nr);
            return;
          }
        }

        for (let i = st.formen.length - 1; i >= 0; i -= 1) {
          if (formTreffer(st.formen[i], p.x, p.y)) {
            st.ausgewaehltIndex = i;
            st.aktion = 'verschieben';
            canvasNeuZeichnen(nr);
            return;
          }
        }

        st.aktion = 'neu';
        if (st.werkzeug === 'kreis') {
          st.formen.push({ typ: 'kreis', cx: p.x, cy: p.y, r: 24 });
        } else {
          st.formen.push({ typ: 'pfeil', x1: p.x, y1: p.y, x2: p.x + 24, y2: p.y });
        }
        st.ausgewaehltIndex = st.formen.length - 1;
        canvasNeuZeichnen(nr);
      };

      const bewegenZeichnen = (e) => {
        const st = bildStatus[nr];
        if (!st || !st.aktion) return;
        e.preventDefault();
        const p = punktErmitteln(e);
        const form = st.formen[st.ausgewaehltIndex];
        if (!form) return;

        if (st.aktion === 'neu' || st.aktion === 'groesse') {
          if (form.typ === 'kreis') {
            form.r = Math.max(14, abstand(form.cx, form.cy, p.x, p.y));
          } else {
            form.x2 = p.x;
            form.y2 = p.y;
          }
        } else if (st.aktion === 'verschieben') {
          const dx = p.x - st.letzterX;
          const dy = p.y - st.letzterY;
          if (form.typ === 'kreis') {
            form.cx += dx;
            form.cy += dy;
          } else {
            form.x1 += dx;
            form.y1 += dy;
            form.x2 += dx;
            form.y2 += dy;
          }
        }

        st.letzterX = p.x;
        st.letzterY = p.y;
        canvasNeuZeichnen(nr);
      };

      const endeZeichnen = (e) => {
        const st = bildStatus[nr];
        if (!st || !st.aktion) return;
        e.preventDefault();
        st.aktion = null;
        canvasNeuZeichnen(nr);
        standSpeichern(nr);
        speichernLokal();
      };

      canvas.addEventListener('mousedown', startZeichnen);
      window.addEventListener('mousemove', bewegenZeichnen);
      window.addEventListener('mouseup', endeZeichnen);
      canvas.addEventListener('touchstart', startZeichnen, { passive: false });
      canvas.addEventListener('touchmove', bewegenZeichnen, { passive: false });
      canvas.addEventListener('touchend', endeZeichnen, { passive: false });
    }

    function canvasNeuZeichnen(nr) {
      const st = bildStatus[nr];
      const canvas = document.getElementById(`canvas-${nr}`);
      if (!st || !canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (st.bild) {
        ctx.drawImage(st.bild, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#334155';
        ctx.font = '15px Arial';
        ctx.fillText('Bild laden und Kreis oder Pfeil ziehen', 20, 42);
      }

      st.formen.forEach((form, idx) => {
        formZeichnen(ctx, form, idx === st.ausgewaehltIndex);
      });
    }

    function formZeichnen(ctx, form, ausgewaehlt) {
      ctx.save();
      ctx.strokeStyle = '#dc2626';
      ctx.fillStyle = '#dc2626';
      ctx.lineWidth = 4;

      if (form.typ === 'kreis') {
        ctx.beginPath();
        ctx.arc(form.cx, form.cy, form.r, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(form.x1, form.y1);
        ctx.lineTo(form.x2, form.y2);
        ctx.stroke();

        const winkel = Math.atan2(form.y2 - form.y1, form.x2 - form.x1);
        const spitze = 14;
        ctx.beginPath();
        ctx.moveTo(form.x2, form.y2);
        ctx.lineTo(form.x2 - spitze * Math.cos(winkel - Math.PI / 6), form.y2 - spitze * Math.sin(winkel - Math.PI / 6));
        ctx.lineTo(form.x2 - spitze * Math.cos(winkel + Math.PI / 6), form.y2 - spitze * Math.sin(winkel + Math.PI / 6));
        ctx.closePath();
        ctx.fill();
      }

      if (ausgewaehlt) {
        const gp = griffPosition(form);
        ctx.fillStyle = '#1d4ed8';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(gp.x, gp.y, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
      ctx.restore();
    }

    function werkzeugWaehlen(nr, typ) {
      bildStatus[nr].werkzeug = typ;
      document.getElementById(`btn-kreis-${nr}`).classList.toggle('active', typ === 'kreis');
      document.getElementById(`btn-pfeil-${nr}`).classList.toggle('active', typ === 'pfeil');
    }

    function editorUmschalten(nr) {
      const box = document.getElementById(`editor-${nr}`);
      box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    function bildAuswaehlen(nr) {
      document.getElementById(`datei-${nr}`).click();
    }

    function bildLaden(event, nr) {
      const datei = event.target.files[0];
      if (!datei) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const dataUrl = ev.target.result;
        const img = new Image();
        img.onload = () => {
          bildStatus[nr].bild = img;
          bildStatus[nr].bildDataUrl = dataUrl;
          bildStatus[nr].formen = [];
          bildStatus[nr].verlauf = [];
          bildStatus[nr].ausgewaehltIndex = -1;
          standSpeichern(nr);
          canvasNeuZeichnen(nr);
          speichernLokal();
        };
        img.src = dataUrl;
      };
      reader.readAsDataURL(datei);
    }

    function einsprechen(feldId) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        alert('Spracheingabe wird in diesem Browser nicht unterstützt.');
        return;
      }
      const rec = new SR();
      rec.lang = 'de-DE';
      rec.onresult = (e) => {
        const text = e.results[0][0].transcript;
        const feld = document.getElementById(feldId);
        feld.value = feld.value ? `${feld.value} ${text}` : text;
        speichernLokal();
      };
      rec.start();
    }

    function speichernLokal(mitHinweis = false) {
      try {
        const schritte = [];
        document.querySelectorAll('#schritteListe .step-card').forEach((karte) => {
          const id = karte.dataset.stepId;
          const st = bildStatus[id];
          schritte.push({
            taetigkeit: document.getElementById(`taetigkeit-${id}`).value,
            werkzeuge: document.getElementById(`werkzeuge-${id}`).value,
            bildDataUrl: st ? st.bildDataUrl : null,
            formen: st ? st.formen.map(objektKlonen) : []
          });
        });

        const stand = {
          docNr: document.getElementById('docNr').value,
          docRev: document.getElementById('docRev').value,
          docTitel: document.getElementById('docTitel').value,
          psaFeld: document.getElementById('psaFeld').value,
          schritte
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(stand));
        if (mitHinweis) {
          document.getElementById('speicherStatus').textContent = 'Entwurf lokal im Browser gespeichert.';
        }
      } catch (err) {
        if (mitHinweis) {
          document.getElementById('speicherStatus').textContent = 'Lokales Speichern aktuell nicht möglich (z. B. Bildgröße).';
        }
      }
    }

    function ladenLokal() {
      try {
        const roh = localStorage.getItem(STORAGE_KEY);
        if (!roh) {
          schrittHinzufuegen('', '', null, [], false);
          return;
        }
        const stand = JSON.parse(roh);
        if (typeof stand.docNr === 'string') document.getElementById('docNr').value = stand.docNr;
        if (typeof stand.docRev === 'string') document.getElementById('docRev').value = stand.docRev;
        if (typeof stand.docTitel === 'string') document.getElementById('docTitel').value = stand.docTitel;
        if (typeof stand.psaFeld === 'string') document.getElementById('psaFeld').value = stand.psaFeld;
        aktualisiereKopfKurz();

        if (Array.isArray(stand.schritte) && stand.schritte.length > 0) {
          stand.schritte.forEach((s) => {
            schrittHinzufuegen(s.taetigkeit || '', s.werkzeuge || '', s.bildDataUrl || null, s.formen || [], false);
          });
        } else {
          schrittHinzufuegen('', '', null, [], false);
        }
      } catch (err) {
        schrittHinzufuegen('', '', null, [], false);
      }
    }

    function entwurfZuruecksetzen() {
      if (!confirm('Alle eingegebenen Schritte und Markierungen zurücksetzen?')) return;
      localStorage.removeItem(STORAGE_KEY);
      document.getElementById('schritteListe').innerHTML = '';
      schrittZaehler = 0;
      Object.keys(bildStatus).forEach((k) => delete bildStatus[k]);
      schrittHinzufuegen('', '', null, [], false);
      document.getElementById('speicherStatus').textContent = 'Entwurf zurückgesetzt.';
    }

    ladenLokal();
  </script>
</body>
</html>
