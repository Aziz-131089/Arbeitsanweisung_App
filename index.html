<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vorschau – AA-FW-014 Rohrdrehmaschine RDM-02</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #475569;
      --primary: #0f172a;
      --danger: #dc2626;
      --danger-bg: #fff1f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
    }
    .preview-banner {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #78350f;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    details.kopfdaten {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 12px;
    }
    details.kopfdaten summary {
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      list-style: none;
    }
    .kopf-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .kopf-full { grid-column: 1 / -1; }
    .psa-box {
      background: var(--danger-bg);
      border: 2px solid var(--danger);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .psa-title {
      color: var(--danger);
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 8px;
    }
    .step-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .step-title {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 10px;
    }
    .field { margin-bottom: 10px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: var(--muted);
      margin-bottom: 4px;
    }
    input[type="text"], textarea {
      width: 100%;
      font-size: 16px;
      padding: 10px 12px;
      border: 1px solid #94a3b8;
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-family: inherit;
    }
    textarea { min-height: 78px; resize: vertical; }
    .btn {
      min-height: 46px;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      border: 1px solid #64748b;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      margin-top: 6px;
      margin-right: 6px;
    }
    .btn.active {
      background: #1d4ed8;
      color: #fff;
      border-color: #1d4ed8;
    }
    .btn-dark {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .btn-red {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }
    .editor-box {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }
    .hint {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
    }
    canvas {
      width: 100%;
      max-width: 440px;
      aspect-ratio: 4 / 3;
      border: 1px solid #94a3b8;
      border-radius: 8px;
      background: #e2e8f0;
      display: block;
      margin-top: 10px;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="preview-banner">VORSCHAU – AA-FW-014 · Rohrdrehmaschine RDM-02 (ohne KI)</div>

    <details class="kopfdaten">
      <summary>Kopfdaten: AA-FW-014 · RDM-02 (zum Aufklappen tippen)</summary>
      <div class="kopf-grid">
        <div>
          <label for="docNr">Dokumenten-Nr.</label>
          <input id="docNr" type="text" value="AA-FW-014" />
        </div>
        <div>
          <label for="docRev">Revision</label>
          <input id="docRev" type="text" value="Rev. 01" />
        </div>
        <div class="kopf-full">
          <label for="docTitel">Arbeitsanweisung / Maschine</label>
          <input id="docTitel" type="text" value="Rüsten und Bedienen der Rohrdrehmaschine RDM-02" />
        </div>
      </div>
    </details>

    <div class="psa-box">
      <div class="psa-title">Sicherheit / PSA</div>
      <textarea id="psaFeld" placeholder="Schutzbrille, Sicherheitsschuhe, Gehörschutz, keine Handschuhe an rotierenden Teilen...">Schutzbrille tragen, enganliegende Kleidung, keine Handschuhe oder lose Teile an rotierenden Maschinenteilen.</textarea>
      <button type="button" class="btn btn-red" onclick="einsprechen('psaFeld')">🎙️ Einsprechen (optional)</button>
    </div>

    <div id="schritteListe"></div>

    <button type="button" class="btn btn-dark" onclick="schrittHinzufuegen()">+ Arbeitsschritt hinzufügen</button>
  </div>

  <script>
    let schrittIndex = 0;
    const bildStatus = {};

    function schrittHinzufuegen(taetigkeit = '', werkzeuge = '') {
      schrittIndex += 1;
      const nr = schrittIndex;
      const karte = document.createElement('div');
      karte.className = 'step-card';
      karte.innerHTML = `
        <div class="step-title">Arbeitsschritt ${nr}</div>
        <div class="field">
          <label for="taetigkeit-${nr}">Tätigkeitsbeschreibung</label>
          <textarea id="taetigkeit-${nr}" placeholder="Tätigkeit eintippen...">${taetigkeit}</textarea>
        </div>
        <div class="field">
          <label for="werkzeuge-${nr}">Werkzeuge / Hilfsmittel</label>
          <input id="werkzeuge-${nr}" type="text" value="${werkzeuge}" placeholder="Werkzeuge / Hilfsmittel eintippen..." />
        </div>
        <div>
          <button type="button" class="btn" onclick="bildAuswaehlen(${nr})">📷 Bild laden</button>
          <button type="button" class="btn" onclick="editorUmschalten(${nr})">Bild bearbeiten</button>
          <input type="file" id="datei-${nr}" accept="image/*" style="display:none" onchange="bildLaden(event, ${nr})" />
        </div>
        <div id="editor-${nr}" class="editor-box">
          <div>
            <button type="button" id="btn-kreis-${nr}" class="btn active" onclick="werkzeugWaehlen(${nr}, 'kreis')">Roter Kreis</button>
            <button type="button" id="btn-pfeil-${nr}" class="btn" onclick="werkzeugWaehlen(${nr}, 'pfeil')">Roter Pfeil</button>
            <button type="button" class="btn btn-dark" onclick="rueckgaengig(${nr})">↩ Rückgängig</button>
          </div>
          <div class="hint">Kreis/Pfeil antippen zum Verschieben · Am blauen Punkt ziehen für Größe &amp; Richtung.</div>
          <canvas id="canvas-${nr}" width="440" height="330"></canvas>
        </div>
      `;
      document.getElementById('schritteListe').appendChild(karte);
      canvasInitialisieren(nr);
    }

    function objektKlonen(obj) {
      return JSON.parse(JSON.stringify(obj));
    }

    function standSpeichern(nr) {
      const st = bildStatus[nr];
      st.verlauf.push(st.formen.map(objektKlonen));
    }

    function rueckgaengig(nr) {
      const st = bildStatus[nr];
      if (!st || st.verlauf.length <= 1) return;
      st.verlauf.pop();
      st.formen = st.verlauf[st.verlauf.length - 1].map(objektKlonen);
      st.ausgewaehltIndex = -1;
      canvasNeuZeichnen(nr);
    }

    function griffPosition(form) {
      if (form.typ === 'kreis') {
        return { x: form.cx + form.r, y: form.cy };
      }
      return { x: form.x2, y: form.y2 };
    }

    function canvasInitialisieren(nr) {
      const canvas = document.getElementById(`canvas-${nr}`);

      bildStatus[nr] = {
        bild: null,
        werkzeug: 'kreis',
        formen: [],
        verlauf: [],
        ausgewaehltIndex: -1,
        aktion: null, // 'neu', 'verschieben', 'groesse'
        letzterX: 0,
        letzterY: 0
      };
      standSpeichern(nr);
      canvasNeuZeichnen(nr);

      const punktErmitteln = (e) => {
        const rect = canvas.getBoundingClientRect();
        const quelle = e.touches && e.touches.length
          ? e.touches[0]
          : (e.changedTouches && e.changedTouches.length ? e.changedTouches[0] : e);
        return {
          x: ((quelle.clientX - rect.left) * canvas.width) / rect.width,
          y: ((quelle.clientY - rect.top) * canvas.height) / rect.height
        };
      };

      const abstand = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

      const formTreffer = (form, px, py) => {
        if (form.typ === 'kreis') {
          return abstand(px, py, form.cx, form.cy) <= form.r + 14;
        }
        const dx = form.x2 - form.x1;
        const dy = form.y2 - form.y1;
        const lenSq = dx * dx + dy * dy || 1;
        const t = Math.max(0, Math.min(1, ((px - form.x1) * dx + (py - form.y1) * dy) / lenSq));
        const projX = form.x1 + t * dx;
        const projY = form.y1 + t * dy;
        return abstand(px, py, projX, projY) <= 16;
      };

      const startZeichnen = (e) => {
        e.preventDefault();
        const st = bildStatus[nr];
        const p = punktErmitteln(e);
        st.letzterX = p.x;
        st.letzterY = p.y;

        // 1. Prüfen, ob der blaue Griffpunkt der aktiven Markierung getroffen wurde
        if (st.ausgewaehltIndex >= 0 && st.formen[st.ausgewaehltIndex]) {
          const gp = griffPosition(st.formen[st.ausgewaehltIndex]);
          if (abstand(p.x, p.y, gp.x, gp.y) <= 20) {
            st.aktion = 'groesse';
            canvasNeuZeichnen(nr);
            return;
          }
        }

        // 2. Prüfen, ob eine bestehende Markierung zum Verschieben getroffen wurde
        for (let i = st.formen.length - 1; i >= 0; i -= 1) {
          if (formTreffer(st.formen[i], p.x, p.y)) {
            st.ausgewaehltIndex = i;
            st.aktion = 'verschieben';
            canvasNeuZeichnen(nr);
            return;
          }
        }

        // 3. Neue Markierung (runder Kreis oder Pfeil) anlegen
        st.aktion = 'neu';
        if (st.werkzeug === 'kreis') {
          st.formen.push({
            typ: 'kreis',
            cx: p.x,
            cy: p.y,
            r: 24
          });
        } else {
          st.formen.push({
            typ: 'pfeil',
            x1: p.x,
            y1: p.y,
            x2: p.x + 24,
            y2: p.y
          });
        }
        st.ausgewaehltIndex = st.formen.length - 1;
        canvasNeuZeichnen(nr);
      };

      const bewegenZeichnen = (e) => {
        const st = bildStatus[nr];
        if (!st.aktion) return;
        e.preventDefault();
        const p = punktErmitteln(e);
        const form = st.formen[st.ausgewaehltIndex];
        if (!form) return;

        if (st.aktion === 'neu' || st.aktion === 'groesse') {
          if (form.typ === 'kreis') {
            form.r = Math.max(14, abstand(form.cx, form.cy, p.x, p.y));
          } else {
            form.x2 = p.x;
            form.y2 = p.y;
          }
        } else if (st.aktion === 'verschieben') {
          const dx = p.x - st.letzterX;
          const dy = p.y - st.letzterY;
          if (form.typ === 'kreis') {
            form.cx += dx;
            form.cy += dy;
          } else {
            form.x1 += dx;
            form.y1 += dy;
            form.x2 += dx;
            form.y2 += dy;
          }
        }

        st.letzterX = p.x;
        st.letzterY = p.y;
        canvasNeuZeichnen(nr);
      };

      const endeZeichnen = (e) => {
        const st = bildStatus[nr];
        if (!st.aktion) return;
        e.preventDefault();
        st.aktion = null;
        canvasNeuZeichnen(nr);
        standSpeichern(nr);
      };

      canvas.addEventListener('mousedown', startZeichnen);
      window.addEventListener('mousemove', bewegenZeichnen);
      window.addEventListener('mouseup', endeZeichnen);
      canvas.addEventListener('touchstart', startZeichnen, { passive: false });
      canvas.addEventListener('touchmove', bewegenZeichnen, { passive: false });
      canvas.addEventListener('touchend', endeZeichnen, { passive: false });
    }

    function canvasNeuZeichnen(nr) {
      const st = bildStatus[nr];
      const canvas = document.getElementById(`canvas-${nr}`);
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (st.bild) {
        ctx.drawImage(st.bild, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#334155';
        ctx.font = '15px Arial';
        ctx.fillText('Bild laden und Kreis oder Pfeil ziehen', 20, 42);
      }

      st.formen.forEach((form, idx) => {
        formZeichnen(ctx, form, idx === st.ausgewaehltIndex);
      });
    }

    function formZeichnen(ctx, form, ausgewaehlt) {
      ctx.save();
      ctx.strokeStyle = '#dc2626';
      ctx.fillStyle = '#dc2626';
      ctx.lineWidth = 4;

      if (form.typ === 'kreis') {
        ctx.beginPath();
        ctx.arc(form.cx, form.cy, form.r, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(form.x1, form.y1);
        ctx.lineTo(form.x2, form.y2);
        ctx.stroke();

        const winkel = Math.atan2(form.y2 - form.y1, form.x2 - form.x1);
        const spitze = 14;
        ctx.beginPath();
        ctx.moveTo(form.x2, form.y2);
        ctx.lineTo(form.x2 - spitze * Math.cos(winkel - Math.PI / 6), form.y2 - spitze * Math.sin(winkel - Math.PI / 6));
        ctx.lineTo(form.x2 - spitze * Math.cos(winkel + Math.PI / 6), form.y2 - spitze * Math.sin(winkel + Math.PI / 6));
        ctx.closePath();
        ctx.fill();
